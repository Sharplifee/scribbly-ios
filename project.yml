name: Scribbly
options:
  bundleIdPrefix: com.connor
  deploymentTarget:
    iOS: "16.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: XF783932R2
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Scribbly:
    type: application
    platform: iOS
    sources:
      - Scribbly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.scribbly
        INFOPLIST_FILE: Scribbly/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Scribbly/Scribbly.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: "Scribbly CI"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: ScribblyControls
      - target: ScribblyWatch
    # Embeds the extension and the watch app automatically because of the dependencies.

  ScribblyControls:
    type: app-extension
    platform: iOS
    sources:
      - ScribblyControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.scribbly.ScribblyControls
        INFOPLIST_FILE: ScribblyControls/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: "ScribblyControls CI"
        SKIP_INSTALL: YES

  ScribblyWatch:
    type: application
    platform: watchOS
    sources:
      - ScribblyWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.scribbly.watchkitapp
        INFOPLIST_FILE: ScribblyWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: "ScribblyWatch CI"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
