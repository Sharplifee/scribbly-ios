name: screenshots
on: [workflow_dispatch]
jobs:
  shots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; xcodebuild -version
      - name: XcodeGen
        run: brew install xcodegen >/dev/null 2>&1 || true; xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Scribbly.xcodeproj -scheme Scribbly -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Boot simulator + install
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
import sys,json
d=json.load(sys.stdin)['devices']
phones=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'SE' not in x['name']]
phones.sort(key=lambda x: ('Pro Max' in x['name'], 'Pro' in x['name'], x['name']))
print(phones[-1]['udid'])")
          xcrun simctl list devices available | grep -i iphone | head -3
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b
          APP=$(find build -name 'Scribbly.app' -path '*iphonesimulator*' | head -1)
          xcrun simctl install $UDID "$APP"
          xcrun simctl privacy $UDID grant microphone com.connor.scribbly || true
      - name: Screenshot each page
        run: |
          mkdir -p shots
          for tab in home library groups more; do
            xcrun simctl terminate $UDID com.connor.scribbly 2>/dev/null || true
            SIMCTL_CHILD_SCRIBBLY_TAB=$tab xcrun simctl launch $UDID com.connor.scribbly >/dev/null
            sleep 9
            xcrun simctl io $UDID screenshot shots/$tab.png
          done
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: shots }
